<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Cadastro de Produto</h1>

<!-- Criar produto -->
<h2>Criar</h2>
<input type="text" id="nome" placeholder="Nome">
<input type="number" id="preco" placeholder="Preço" step="0.01">
<button onclick="criar()">Salvar</button>

<hr>

<!-- Buscar produto -->
<h2>Buscar</h2>
<input type="number" id="buscarId" placeholder="ID">
<button onclick="buscar()">Buscar</button>
<pre id="resultadoBuscar"></pre>

<hr>

<!-- Deletar produto -->
<h2>Deletar</h2>
<input type="number" id="deletarId" placeholder="ID">
<button onclick="deletar()">Deletar</button>

<hr>

<!-- Atualizar produto -->
<h2>Atualizar</h2>
<input type="number" id="id" placeholder="ID">
<input type="text" id="novoNome" placeholder="Novo Nome">
<input type="number" id="novoPreco" placeholder="Novo Preço" step="0.01">
<button onclick="atualizar()">Atualizar</button>

<script>
    const api = "/produto";

    async function criar() {
        const resp = await fetch(api, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome: document.getElementById("nome").value,
                preco: parseFloat(document.getElementById("preco").value)
            })
        });
        alert(resp.ok ? "Produto criado!" : "Erro ao criar!");
    }

    async function buscar() {
        const id = document.getElementById("buscarId").value;
        const resultado = document.getElementById("resultadoBuscar");
        const resp = await fetch(`${api}?id=${encodeURIComponent(id)}`);
        if (resp.ok) {
            const texto = await resp.text();
            resultado.innerText = texto
                ? JSON.stringify(JSON.parse(texto), null, 2)
                : "Produto não encontrado!";
        } else {
            resultado.innerText = "Produto não encontrado!";
        }
    }

    async function deletar() {
        const id = document.getElementById("deletarId").value;
        const resp = await fetch(`${api}?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        alert(resp.ok ? "Produto deletado!" : "Erro ao deletar!");
    }

    async function atualizar() {
        const id = document.getElementById("id").value;
        const resp = await fetch(`${api}?id=${encodeURIComponent(id)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome: document.getElementById("novoNome").value,
                preco: parseFloat(document.getElementById("novoPreco").value)
            })
        });
        alert(resp.ok ? "Produto atualizado!" : "Erro ao atualizar!");
    }
</script>
</body>
</html>
